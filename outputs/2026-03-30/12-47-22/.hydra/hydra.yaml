  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /root/MRTOPSD
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/MRTOPSD/third_party/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/MRTOPSD/outputs/2026-03-30/12-47-22
    choices:
