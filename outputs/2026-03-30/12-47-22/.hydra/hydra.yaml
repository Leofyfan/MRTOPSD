    name: main_ppo
    chdir: null
    override_dirname: +data.apply_chat_template_kwargs.enable_thinking=False,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.model_dtype=bf16,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.optim.lr=5e-6,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=4096,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=4,actor_rollout_ref.actor.strategy=fsdp2,actor_rollout_ref.actor.use_dynamic_bsz=True,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.lora_alpha=128,actor_rollout_ref.model.lora_rank=64,actor_rollout_ref.model.path=/root/autodl-tmp/Qwen3-4B,actor_rollout_ref.model.target_modules=["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"],actor_rollout_ref.model.trust_remote_code=True,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=False,actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=4096,actor_rollout_ref.ref.log_prob_use_dynamic_bsz=True,actor_rollout_ref.rollout.agent.num_workers=1,actor_rollout_ref.rollout.enforce_eager=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.35,actor_rollout_ref.rollout.load_format=safetensors,actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=4096,actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=True,actor_rollout_ref.rollout.max_model_len=3072,actor_rollout_ref.rollout.max_num_batched_tokens=8192,actor_rollout_ref.rollout.max_num_seqs=4,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.prompt_length=2048,actor_rollout_ref.rollout.response_length=128,actor_rollout_ref.rollout.temperature=1.1,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.top_k=20,actor_rollout_ref.rollout.top_p=0.95,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward